name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Includes src/tokens/tokens.contrast.test.ts — the WCAG AA contrast
      # gate. See that file's header comment for what it checks and why.
      - run: pnpm test

      - run: pnpm build

  a11y:
    name: Storybook accessibility (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build-storybook

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      # Runs axe-core against every story via .storybook/test-runner.ts.
      - run: pnpm test-storybook:ci

  keyboard:
    name: Page a11y + keyboard (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      # Two suites against the real built page:
      #   e2e/a11y.spec.ts        — axe over the assembled dashboard (light,
      #     dark, loading), covering the five document-level rules the
      #     per-story pass above has to disable, plus anything that only goes
      #     wrong once components are composed.
      #   e2e/keyboard-nav.spec.ts — the Tab walk: full tab order, accessible
      #     names, focus rings. Catches a stray focusable element, which
      #     neither the contrast test nor either axe pass can see.
      # (playwright.config.ts builds + serves the app itself.)
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
